# Tests only. Keeps `mvn test` runnable with no PostgreSQL on the machine,
# which is what a CI runner needs. The application itself never uses H2.
spring.datasource.url=jdbc:h2:mem:meetjava-test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
logging.level.com.mallika.meetjava=INFO
