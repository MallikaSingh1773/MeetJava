spring.application.name=MeetJava
server.port=${PORT:8080}

# ---------------------------------------------------------------- database
# PostgreSQL. Every value can be overridden by an environment variable, so the
# same build runs locally and in production without editing this file.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/meetjava}
spring.datasource.username=${DB_USER:meetjava}
spring.datasource.password=${DB_PASSWORD:meetjava}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Connection pool. Small on purpose: this app holds no long transactions,
# the work is WebSocket traffic, not database traffic.
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=10000

# Fail fast with a readable message instead of a stack trace at first request.
spring.sql.init.continue-on-error=false

# ---------------------------------------------------------------- web
spring.thymeleaf.cache=false

# ---------------------------------------------------------------- media / ICE
# STUN is enough on one network. Real internet calls need TURN as well:
# two peers behind symmetric NAT can never reach each other with STUN alone.
meetjava.ice.stun=${STUN_URL:stun:stun.l.google.com:19302}
meetjava.ice.turn.url=${TURN_URL:}
meetjava.ice.turn.username=${TURN_USERNAME:}
meetjava.ice.turn.credential=${TURN_CREDENTIAL:}

logging.level.com.mallika.meetjava=DEBUG
