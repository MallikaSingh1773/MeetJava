# Render blueprint.
#
#   Render dashboard -> New -> Blueprint -> pick this repository
#
# The database is not provisioned here. DATABASE_URL is supplied at deploy time,
# which keeps the application portable across PostgreSQL hosts and avoids
# Render's one-free-database-per-workspace limit.
#
# Free tier note: the web service sleeps after 15 minutes of inactivity and
# takes roughly a minute to wake.

services:
  - type: web
    name: meetjava
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      # The PostgreSQL connection string, in postgresql:// form. Supplied at
      # deploy time rather than provisioned here, so the database can live on
      # any managed host without changing this file.
      - key: DATABASE_URL
        sync: false
      - key: JAVA_OPTS
        value: -XX:MaxRAMPercentage=70 -XX:+UseSerialGC
      - key: THYMELEAF_CACHE
        value: "true"
      - key: LOG_LEVEL
        value: INFO
      - key: STUN_URL
        value: stun:stun.l.google.com:19302
      # A browser on a mobile or corporate network cannot connect with STUN
      # alone. Fill these in from any TURN provider and redeploy.
      - key: TURN_URL
        sync: false
      - key: TURN_USERNAME
        sync: false
      - key: TURN_CREDENTIAL
        sync: false
