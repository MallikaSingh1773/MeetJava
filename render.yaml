# Render blueprint. Creating a new service from this file provisions the web
# service and its PostgreSQL database together, with the connection string wired
# in automatically.
#
#   Render dashboard -> New -> Blueprint -> pick this repository
#
# Free tier notes: the web service sleeps after 15 minutes of inactivity and
# takes roughly a minute to wake, and a free database is removed after 30 days.
# Moving to a different PostgreSQL host later is a change to DATABASE_URL and
# nothing else.

databases:
  - name: meetjava-db
    databaseName: meetjava
    user: meetjava
    plan: free

services:
  - type: web
    name: meetjava
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: meetjava-db
          property: connectionString
      - key: JAVA_OPTS
        value: -XX:MaxRAMPercentage=70 -XX:+UseSerialGC
      - key: THYMELEAF_CACHE
        value: "true"
      - key: LOG_LEVEL
        value: INFO
      - key: STUN_URL
        value: stun:stun.l.google.com:19302
      # A browser on a mobile or corporate network cannot connect with STUN
      # alone. Fill these in from any TURN provider and redeploy.
      - key: TURN_URL
        sync: false
      - key: TURN_USERNAME
        sync: false
      - key: TURN_CREDENTIAL
        sync: false
